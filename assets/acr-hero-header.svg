<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%" style="background:#050711; border-radius:16px; overflow:hidden; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background glow gradients -->
    <radialGradient id="bg-glow-1" cx="30%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#050711" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-glow-2" cx="75%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#050711" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e0f2fe"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="line-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="line-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Filters for glows -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulse-slow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.05); }
    }
    @keyframes packet-flow-1 {
      0% { offset-distance: 0%; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes packet-flow-2 {
      0% { offset-distance: 0%; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes glint {
      0% { transform: translateX(-150%) skewX(-25deg); }
      35%, 100% { transform: translateX(250%) skewX(-25deg); }
    }
    @keyframes beacon-ping {
      0% { r: 6px; opacity: 1; stroke-width: 2px; }
      100% { r: 24px; opacity: 0; stroke-width: 0px; }
    }
    @keyframes float-subtle {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(0px, -7px); }
    }
    @keyframes float-subtle-alt {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(0px, -6px); }
    }
    .node-orbit { animation: float-subtle 6s ease-in-out infinite; }
    .node-orbit-alt { animation: float-subtle-alt 6.5s ease-in-out infinite reverse; }
    .pulse-glow { animation: pulse-slow 4s ease-in-out infinite; }
    .flow-dot-1 {
      offset-path: path("M 240 245 C 380 195, 480 275, 600 245");
      animation: packet-flow-1 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .flow-dot-2 {
      offset-path: path("M 600 245 C 720 215, 840 275, 960 245");
      animation: packet-flow-2 4s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.2s;
    }
    .flow-dot-3 {
      offset-path: path("M 600 245 C 550 330, 450 375, 380 375");
      animation: packet-flow-1 4.2s cubic-bezier(0.4, 0, 0.2, 1) infinite 0.6s;
    }
    .beacon {
      animation: beacon-ping 2.5s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    .shimmer-glint {
      animation: glint 7s ease-in-out infinite;
    }
  </style>

  <!-- Background Rect with subtle border -->
  <rect width="1200" height="480" fill="#050711"/>
  <rect width="1200" height="480" fill="url(#bg-glow-1)"/>
  <rect width="1200" height="480" fill="url(#bg-glow-2)"/>
  <rect width="1198" height="478" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Subtle Cybernetic Grid Pattern -->
  <g opacity="0.05" stroke="#38bdf8" stroke-width="0.8">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
    <line x1="800" y1="0" x2="800" y2="480" />
    <line x1="960" y1="0" x2="960" y2="480" />
    <line x1="1120" y1="0" x2="1120" y2="480" />
  </g>

  <!-- Network Mesh Interconnect Curves -->
  <g fill="none" stroke-linecap="round">
    <path d="M 240 245 C 380 195, 480 275, 600 245" stroke="url(#line-grad-1)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.75"/>
    <path d="M 600 245 C 720 215, 840 275, 960 245" stroke="url(#line-grad-2)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.75"/>
    <path d="M 600 245 C 550 330, 450 375, 380 375" stroke="url(#line-grad-1)" stroke-width="2" stroke-dasharray="4 4" opacity="0.55"/>
    <path d="M 240 245 C 280 320, 320 360, 380 375" stroke="url(#line-grad-2)" stroke-width="1.8" opacity="0.45"/>
    <path d="M 600 245 C 680 330, 750 375, 820 375" stroke="url(#line-grad-1)" stroke-width="1.8" opacity="0.45"/>
    <path d="M 820 375 C 880 360, 920 320, 960 245" stroke="url(#line-grad-2)" stroke-width="1.8" opacity="0.45"/>
  </g>

  <!-- Flowing Cryptographic Data Packets -->
  <circle class="flow-dot-1" r="5" fill="#38bdf8" filter="url(#glow)"/>
  <circle class="flow-dot-2" r="5" fill="#c084fc" filter="url(#glow)"/>
  <circle class="flow-dot-3" r="4.5" fill="#34d399" filter="url(#glow)"/>

  <!-- Left Agent Node Cluster (Safe interior positioning at x=240, y=245) -->
  <g transform="translate(240, 245)">
    <g class="node-orbit">
      <circle r="30" fill="#070a1e" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" filter="url(#glow)"/>
      <circle class="beacon" r="12" fill="none" stroke="#38bdf8"/>
      <circle r="8" fill="#0284c7"/>
      <circle r="3.5" fill="#e0f2fe"/>
      <rect x="-65" y="36" width="130" height="22" rx="11" fill="rgba(7, 10, 30, 0.9)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
      <text x="0" y="51" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">did:key:agent-alpha</text>
    </g>
  </g>

  <!-- Center Deliberation Nexus Hub (x=600, y=245) -->
  <g transform="translate(600, 245)">
    <circle r="46" fill="#0b102b" stroke="rgba(99, 102, 241, 0.5)" stroke-width="2" filter="url(#soft-glow)"/>
    <circle class="beacon" r="20" fill="none" stroke="#818cf8" style="animation-delay: 1.2s;"/>
    <polygon points="0,-18 17,-7 17,13 0,22 -17,13 -17,-7" fill="rgba(99, 102, 241, 0.25)" stroke="#818cf8" stroke-width="1.8"/>
    <circle r="6" fill="#38bdf8"/>
    <rect x="-80" y="52" width="160" height="24" rx="12" fill="rgba(11, 16, 43, 0.9)" stroke="rgba(99, 102, 241, 0.35)" stroke-width="1"/>
    <text x="0" y="68" fill="#c7d2fe" font-size="11" font-family="monospace" font-weight="600" text-anchor="middle">#consensus-main</text>
  </g>

  <!-- Right Sentinel Node Cluster (Safe interior positioning at x=960, y=245) -->
  <g transform="translate(960, 245)">
    <g class="node-orbit-alt">
      <circle r="30" fill="#140727" stroke="rgba(168, 85, 247, 0.45)" stroke-width="1.5" filter="url(#glow)"/>
      <circle class="beacon" r="10" fill="none" stroke="#c084fc" style="animation-delay: 0.6s;"/>
      <circle r="7" fill="#9333ea"/>
      <circle r="3" fill="#faf5ff"/>
      <rect x="-65" y="36" width="130" height="22" rx="11" fill="rgba(20, 7, 39, 0.9)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1"/>
      <text x="0" y="51" fill="#d8b4fe" font-size="10" font-family="monospace" text-anchor="middle">did:key:sentinel-01</text>
    </g>
  </g>

  <!-- Lower Ledger Hash Chain Node (x=380, y=375) -->
  <g transform="translate(380, 375)">
    <rect x="-60" y="-15" width="120" height="30" rx="8" fill="rgba(6, 20, 26, 0.92)" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1"/>
    <circle cx="-42" cy="0" r="4.5" fill="#10b981"/>
    <text x="8" y="4" fill="#6ee7b7" font-size="10" font-family="monospace" font-weight="600" text-anchor="middle">SHA-256 LEDGER</text>
  </g>

  <!-- Lower Right Audit Replay Node (x=820, y=375) -->
  <g transform="translate(820, 375)">
    <rect x="-65" y="-15" width="130" height="30" rx="8" fill="rgba(25, 12, 35, 0.92)" stroke="rgba(244, 114, 182, 0.35)" stroke-width="1"/>
    <circle cx="-46" cy="0" r="4.5" fill="#ec4899"/>
    <text x="10" y="4" fill="#fbcfe8" font-size="10" font-family="monospace" font-weight="600" text-anchor="middle">DISSENT LOGGED</text>
  </g>

  <!-- TOP FLOATING STATUS PILL BADGE -->
  <g transform="translate(600, 48)">
    <rect x="-210" y="-18" width="420" height="36" rx="18" fill="rgba(10, 14, 28, 0.85)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" filter="url(#glow)"/>
    <rect x="-208" y="-17" width="416" height="16" rx="8" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" opacity="0.6"/>
    <circle cx="-180" cy="0" r="4.5" fill="#10b981" filter="url(#glow)"/>
    <circle class="beacon" cx="-180" cy="0" r="4.5" fill="none" stroke="#34d399"/>
    <text x="10" y="5" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="1.5" text-anchor="middle">AGENTIC CHAT ROOMS PROTOCOL • v0.8.2</text>
  </g>

  <!-- MAIN DISPLAY HEADER -->
  <g transform="translate(600, 122)">
    <text x="0" y="0" fill="url(#title-grad)" font-size="42" font-weight="800" letter-spacing="-0.5" text-anchor="middle">
      Agentic Chat Rooms
    </text>
    <text x="0" y="28" fill="#94a3b8" font-size="15" font-weight="400" letter-spacing="0.3" text-anchor="middle">
      Zero-Trust Autonomous Agent Deliberation Mesh &amp; Cryptographic Consensus
    </text>
  </g>

  <!-- BOTTOM FEATURE BADGES -->
  <g transform="translate(600, 440)">
    <g transform="translate(-360, 0)">
      <rect x="-80" y="-14" width="160" height="28" rx="14" fill="rgba(14, 165, 233, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
      <text x="0" y="4" fill="#7dd3fc" font-size="11" font-weight="600" text-anchor="middle">W3C DID &amp; VC Identity</text>
    </g>
    <g transform="translate(-180, 0)">
      <rect x="-80" y="-14" width="160" height="28" rx="14" fill="rgba(99, 102, 241, 0.12)" stroke="rgba(129, 140, 248, 0.35)" stroke-width="1"/>
      <text x="0" y="4" fill="#a5b4fc" font-size="11" font-weight="600" text-anchor="middle">ACP v2 Session Substrate</text>
    </g>
    <g transform="translate(10, 0)">
      <rect x="-95" y="-14" width="190" height="28" rx="14" fill="rgba(236, 72, 153, 0.12)" stroke="rgba(244, 114, 182, 0.35)" stroke-width="1"/>
      <text x="0" y="4" fill="#f472b6" font-size="11" font-weight="600" text-anchor="middle">Mandatory Dissent Logged</text>
    </g>
    <g transform="translate(205, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1"/>
      <text x="0" y="4" fill="#6ee7b7" font-size="11" font-weight="600" text-anchor="middle">Formal TLA+ Invariants</text>
    </g>
    <g transform="translate(385, 0)">
      <rect x="-80" y="-14" width="160" height="28" rx="14" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(251, 191, 36, 0.35)" stroke-width="1"/>
      <text x="0" y="4" fill="#fcd34d" font-size="11" font-weight="600" text-anchor="middle">Zero-CLS Live Telemetry</text>
    </g>
  </g>

  <!-- Ambient Shimmer Glint Sweep -->
  <g opacity="0.15" pointer-events="none">
    <rect class="shimmer-glint" x="0" y="0" width="160" height="480" fill="url(#line-grad-1)"/>
  </g>
</svg>
